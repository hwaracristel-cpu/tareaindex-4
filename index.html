<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-yellow-300">

    <h1 class="text-red-500 text-3xl text-center">
        Hola mundo, probando Tailwind
    </h1>

    <div class="bg-yellow-400">
        <h2 class="text-blue-900 text-2xl text-center">
            Tailwind por: Cristal Pinaya Huaynoca
        </h2>
    </div>

    <div class="container columns-3">
        <div>
            <h2>blur</h2>

            <img src="img/img1.jpg"
                 class="w-40 h-40 rounded-full blur-md"
                 alt="">
        </div>
        <div>
            <h2>transparente</h2>

            <img src="img/img2.jpg"
                 class="w-40 h-40 rounded-full opacity-50"
                 alt="">
        </div>
        <div>
            <h2>escala</h2>

            <img src="img/img1.jpg"
                 class="w-40 h-40 rounded-full scale-75"
                 alt="">
        </div>

    </div>


 

    <div class="container columns-3 mt-10">
        <div>
            <h2>intensidad</h2>

            <img src="img/img2.jpg"
                 class="w-40 h-40 brightness-150"
                 alt="">
        </div>

       
        <div>
            <h2>opacidad</h2>
            <img src="img/img1.jpg"
                 class="w-40 h-40 opacity-50"
                 alt="">
        </div>

        <div>
            <h2>filtro</h2>

            <img src="img/img2.jpg"
                 class="w-40 h-40 grayscale"
                 alt="">
        </div>

    </div>


    <div class="bg-yellow-400 mt-10">
        <h2 class="text-blue-900 text-center">
            Diseñado por: Cristal Pinaya Huaynoca
        </h2>
    </div>

</body>
</html>
